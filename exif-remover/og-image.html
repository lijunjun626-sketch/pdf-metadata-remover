<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <title>EXIF Remover — Open Graph Image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f8fc; }
    main { position: relative; width: 1200px; height: 630px; padding: 64px 72px; background: radial-gradient(circle at 88% 14%, #dce7ff 0, #edf2ff 24%, transparent 48%), linear-gradient(145deg, #fbfcff 0%, #f2f6ff 100%); }
    .glow { position: absolute; right: 72px; bottom: 52px; width: 390px; height: 390px; border-radius: 50%; background: #dce7ff; opacity: .62; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; color: white; background: #3568e8; box-shadow: 0 12px 30px #3568e83d; }
    .copy { position: relative; z-index: 2; width: 690px; margin-top: 78px; }
    h1 { margin: 0; font-size: 68px; line-height: .98; letter-spacing: -.055em; }
    .tagline { margin: 24px 0 0; color: #52617b; font-size: 28px; line-height: 1.35; letter-spacing: -.02em; }
    .privacy { display: inline-flex; align-items: center; gap: 10px; margin-top: 34px; padding: 12px 18px; border-radius: 999px; color: #176447; background: #e7f7ee; font-size: 19px; font-weight: 700; }
    .card { position: absolute; z-index: 2; right: 72px; top: 112px; width: 350px; padding: 26px; border: 1px solid #dfe6f3; border-radius: 24px; background: #ffffffed; box-shadow: 0 28px 70px #273d6724; }
    .photo { height: 142px; border-radius: 16px; background: linear-gradient(160deg, #8ba7f8, #355bbd); position: relative; overflow: hidden; }
    .photo:before { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; right: -42px; top: 44px; background: #e7f7ee; }
    .photo:after { content: ""; position: absolute; left: 38px; bottom: 24px; border-left: 62px solid transparent; border-right: 62px solid transparent; border-bottom: 92px solid #edf2ff; }
    .rows { display: grid; gap: 14px; margin-top: 22px; }
    .row { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; }
    .row span:first-child { color: #718097; }
    .row span:last-child { color: #172033; font-weight: 650; }
    .button { margin-top: 22px; padding: 14px 18px; border-radius: 11px; color: #176447; background: #e7f7ee; text-align: center; font-size: 17px; font-weight: 750; }
    footer { position: absolute; left: 72px; bottom: 46px; color: #6c7890; font-size: 20px; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <div class="glow"></div>
    <div class="brand"><div class="mark" aria-hidden="true">⌁</div>PDF Metadata Remover</div>
    <section class="copy">
      <h1>Remove hidden photo metadata.</h1>
      <p class="tagline">Inspect GPS, camera and timestamp data. Clean it locally.</p>
      <div class="privacy">✓ No upload &nbsp;·&nbsp; Lossless &nbsp;·&nbsp; Free</div>
    </section>
    <aside class="card" aria-label="EXIF metadata cleaning preview">
      <div class="photo"></div>
      <div class="rows">
        <div class="row"><span>GPS location</span><span>Removed</span></div>
        <div class="row"><span>Camera</span><span>Removed</span></div>
        <div class="row"><span>Image pixels</span><span>Unchanged</span></div>
      </div>
      <div class="button">✓ Clean copy verified</div>
    </aside>
    <footer>pdfmetadataremover.com/exif-remover</footer>
  </main>
</body>
</html>

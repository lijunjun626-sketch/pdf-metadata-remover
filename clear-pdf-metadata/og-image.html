<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <title>Clear PDF Metadata — Open Graph Image</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f8fc; }
    main { position: relative; width: 1200px; height: 630px; padding: 64px 72px; background: radial-gradient(circle at 88% 14%, #dce7ff 0, #edf2ff 24%, transparent 48%), linear-gradient(145deg, #fbfcff 0%, #f2f6ff 100%); }
    .glow { position: absolute; right: 72px; bottom: 52px; width: 390px; height: 390px; border-radius: 50%; background: #dce7ff; filter: blur(4px); opacity: .62; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; color: white; background: #3568e8; box-shadow: 0 12px 30px #3568e83d; }
    .mark svg { width: 27px; height: 27px; }
    .copy { position: relative; z-index: 2; width: 690px; margin-top: 78px; }
    h1 { margin: 0; font-size: 68px; line-height: .98; letter-spacing: -.055em; }
    .tagline { margin: 24px 0 0; color: #52617b; font-size: 28px; line-height: 1.35; letter-spacing: -.02em; }
    .privacy { display: inline-flex; align-items: center; gap: 10px; margin-top: 34px; padding: 12px 18px; border-radius: 999px; color: #176447; background: #e7f7ee; font-size: 19px; font-weight: 700; }
    .card { position: absolute; z-index: 2; right: 72px; top: 118px; width: 342px; padding: 26px; border: 1px solid #dfe6f3; border-radius: 24px; background: #ffffffed; box-shadow: 0 28px 70px #273d6724; }
    .file { display: flex; align-items: center; gap: 15px; padding-bottom: 22px; border-bottom: 1px solid #edf0f5; }
    .file-icon { display: grid; place-items: center; width: 52px; height: 60px; border-radius: 10px; color: #3568e8; background: #edf2ff; font-size: 14px; font-weight: 800; }
    .file strong { display: block; font-size: 18px; }
    .file span { display: block; margin-top: 6px; color: #77839a; font-size: 14px; }
    .rows { display: grid; gap: 15px; margin-top: 22px; }
    .row { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; }
    .row span:first-child { color: #718097; }
    .row span:last-child { max-width: 164px; overflow: hidden; color: #172033; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .button { margin-top: 24px; padding: 14px 18px; border-radius: 11px; color: #176447; background: #e7f7ee; text-align: center; font-size: 17px; font-weight: 750; }
    footer { position: absolute; left: 72px; bottom: 46px; color: #6c7890; font-size: 20px; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <div class="glow"></div>
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="m9.5 15 1.7 1.7 3.6-4"/></svg></div>
      PDF Metadata Remover
    </div>
    <section class="copy">
      <h1>Clear PDF metadata. Verify the result.</h1>
      <p class="tagline">A private before-and-after check — directly in your browser.</p>
      <div class="privacy">✓ No upload &nbsp;·&nbsp; No account &nbsp;·&nbsp; Free</div>
    </section>
    <aside class="card" aria-label="PDF metadata cleaning preview">
      <div class="file"><div class="file-icon">PDF</div><div><strong>proposal.pdf</strong><span>Before → after</span></div></div>
      <div class="rows">
        <div class="row"><span>Common fields</span><span>6 → 0</span></div>
        <div class="row"><span>Page count</span><span>12 → 12</span></div>
        <div class="row"><span>Upload</span><span>None</span></div>
      </div>
      <div class="button">✓ Verification passed</div>
    </aside>
    <footer>pdfmetadataremover.com</footer>
  </main>
</body>
</html>
